name: Collect GNSS updates
on:
  schedule:
    - cron: "30 2 * * *"         # 08:00 IST: collect + daily digest
    - cron: "30 8,14,20 * * *"   # extra collections
  workflow_dispatch:              # "Refresh now" button
    inputs:
      digest:
        description: "Send Telegram digest"
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: collect, cancel-in-progress: false }
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          if [ "${{ github.event.schedule }}" = "30 2 * * *" ] || [ "${{ inputs.digest }}" = "true" ]; then
            python main.py --digest
          else
            python main.py
          fi
      - name: Commit data
        run: |
          git config user.name "gnss-pulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add web/data/items.json
          git diff --staged --quiet || git commit -m "data: $(date -u +%F_%H%M)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }
      - uses: actions/deploy-pages@v4
