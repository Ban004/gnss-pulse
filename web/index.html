<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GNSS Pulse</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><meta name="theme-color" content="#0b1220">
<style>
:root{--bg:#0b1220;--card:#131c2e;--text:#e5e9f0;--muted:#8b98ad;--accent:#38bdf8}
@media (prefers-color-scheme:light){:root{--bg:#f4f6fa;--card:#fff;--text:#111827;--muted:#5b6475}}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;background:var(--bg);padding:12px 16px 8px;border-bottom:1px solid #8882;z-index:1}
h1{margin:0 0 4px;font-size:20px}h1 span{color:var(--accent)}#meta{color:var(--muted);font-size:12px}
nav{display:flex;gap:6px;margin:10px 0 8px;overflow-x:auto}
nav button{border:1px solid #8884;background:none;color:var(--text);padding:6px 12px;border-radius:99px;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--accent);color:#000;border-color:var(--accent)}
.row{display:flex;gap:8px}input,select{flex:1;padding:8px;border-radius:8px;border:1px solid #8884;background:var(--card);color:var(--text)}
select{flex:0 0 auto}.row{flex-wrap:wrap}input{min-width:160px}
main{max-width:860px;margin:auto;padding:12px 16px 40px}
.card{background:var(--card);border-radius:12px;padding:12px 14px;margin:10px 0;border-left:4px solid #8884}
.card.imp4{border-left-color:#f59e0b}.card.imp5{border-left-color:#ef4444}
.card a{color:var(--text);font-weight:600;text-decoration:none}.card a:hover{color:var(--accent)}
.tags{font-size:12px;color:var(--muted);margin-top:4px}.tag{display:inline-block;background:#8882;border-radius:6px;padding:1px 6px;margin-right:4px}
.sum{margin:6px 0 0;font-size:14px;color:var(--muted)}.star{float:right;background:none;border:0;font-size:18px;cursor:pointer;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:40px}
</style>
</head>
<body>
<header>
  <h1>🛰️ GNSS <span>Pulse</span></h1><div id="meta">Loading…</div>
  <nav id="tabs"></nav>
  <div class="row"><input id="q" placeholder="Search title, venue, summary…"><select id="region"><option value="">🌍 All</option><option>India</option><option>Europe</option><option>Other</option></select><select id="days">
    <option value="1">24h</option><option value="7" selected>7 days</option><option value="30">30 days</option><option value="9999">All</option></select></div>
</header>
<main id="list"></main>
<script>
const JOBS=["job","internship","phd","postdoc"], PAPERS=["paper","preprint","conference","book_chapter","thesis","article"];
const TABS={Today:i=>Date.now()-new Date(i.added)<864e5, Papers:i=>PAPERS.includes(i.category),
  Jobs:i=>JOBS.includes(i.category), "News & more":i=>!JOBS.includes(i.category)&&!PAPERS.includes(i.category),
  "★ Saved":i=>saved.has(i.id)};
let items=[], tab="Today", saved=new Set(JSON.parse(localStorage.saved||"[]"));
const $=s=>document.querySelector(s), esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
$("#tabs").innerHTML=Object.keys(TABS).map(t=>`<button data-t="${t}">${t}</button>`).join("");
$("#tabs").onclick=e=>{if(e.target.dataset.t){tab=e.target.dataset.t;render()}};
$("#q").oninput=$("#days").onchange=$("#region").onchange=render;
$("#list").onclick=e=>{const id=e.target.dataset.star;if(!id)return;saved.has(id)?saved.delete(id):saved.add(id);
  localStorage.saved=JSON.stringify([...saved]);render()};
function render(){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t==tab));
  const q=$("#q").value.toLowerCase(), cut=Date.now()-$("#days").value*864e5, reg=$("#region").value;
  const rows=items.filter(TABS[tab]).filter(i=>tab=="★ Saved"||new Date(i.added)>=cut)
    .filter(i=>!reg||(i.region||"Other")==reg)
    .filter(i=>!q||(i.title+i.venue+i.ai_summary+i.summary+i.source).toLowerCase().includes(q))
    .sort((a,b)=>b.importance-a.importance||b.added.localeCompare(a.added));
  $("#list").innerHTML=rows.length?rows.map(i=>`<div class="card imp${i.importance}">
    <button class="star" data-star="${i.id}">${saved.has(i.id)?"★":"☆"}</button>
    <a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a>
    <div class="tags"><span class="tag">${esc(i.category)}</span>${i.tier&&i.tier!="unknown"?`<span class="tag">${esc(i.tier)}</span>`:""}
    ${esc(i.venue||i.source)} · ${esc(i.date||"")}${i.deadline?` · ⏰ ${esc(i.deadline)}`:""}${i.location||i.region?` · 📍 ${esc(i.location||i.region)}`:""}</div>
    <p class="sum">${esc(i.ai_summary||(i.summary||"").slice(0,260))}</p></div>`).join("")
    :`<div class="empty">Nothing here yet.</div>`;
}
fetch("data/items.json?"+Date.now()).then(r=>r.json()).then(d=>{items=d.items;
  $("#meta").textContent=`${items.length} items · updated ${new Date(d.updated).toLocaleString()}`;render()})
  .catch(()=>{$("#meta").textContent="No data yet: run the collector first.";render()});
</script>
</body>
</html>
