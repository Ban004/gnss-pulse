<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GNSS Pulse: Satellite Navigation Intelligence</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><meta name="theme-color" content="#0f2a4a">
<style>
:root{--bg:#f5f7fa;--surface:#fff;--text:#1a2433;--muted:#5f6b7a;--line:#e3e8ef;--brand:#0f2a4a;--accent:#1f6feb;
  --paper:#1f6feb;--job:#0e8a5f;--news:#b4580f;--hot:#c2410c;--chip:#eef2f7}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--surface:#161b22;--text:#e6edf3;--muted:#8b949e;--line:#262d36;
  --brand:#0b1f38;--accent:#58a6ff;--paper:#58a6ff;--job:#3fb950;--news:#e3a14a;--hot:#f0883e;--chip:#21262d}}
*{box-sizing:border-box}
body{margin:0;font:14.5px/1.5 -apple-system,"Segoe UI",Inter,Roboto,sans-serif;background:var(--bg);color:var(--text)}
a{color:inherit}
.top{background:var(--brand);color:#fff}
.top .in{max-width:1080px;margin:auto;padding:14px 20px 0;display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:.2px}
.logo img{width:30px;height:30px}.logo small{display:block;font-weight:400;font-size:11.5px;opacity:.7;letter-spacing:.3px}
.search{margin-left:auto;flex:1 1 260px;max-width:360px}
.search input{width:100%;padding:8px 12px;border-radius:8px;border:0;background:#ffffff1f;color:#fff;font-size:14px}
.search input::placeholder{color:#ffffffa0}
nav{max-width:1080px;margin:auto;padding:0 20px;display:flex;gap:2px;overflow-x:auto}
nav button{background:none;border:0;color:#ffffffb0;padding:12px 14px 11px;font-size:14px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:#fff;border-bottom-color:#58a6ff;font-weight:600}
nav .n{font-size:11px;background:#ffffff26;border-radius:10px;padding:1px 7px;margin-left:5px}
main{max-width:1080px;margin:auto;padding:20px}
.meta{color:var(--muted);font-size:12.5px;margin-bottom:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer}
.tile b{display:block;font-size:26px;line-height:1.1}.tile span{color:var(--muted);font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.panel h3{margin:0;padding:12px 16px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.panel h3 a{text-transform:none;letter-spacing:0;color:var(--accent);cursor:pointer;font-weight:500;text-decoration:none}
.panel .row{padding:10px 16px;border-bottom:1px solid var(--line)}.panel .row:last-child{border:0}
.panel .row a{font-weight:600;text-decoration:none;font-size:13.5px}.panel .row a:hover{color:var(--accent)}
.panel .sub{color:var(--muted);font-size:12px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--text);padding:5px 12px;border-radius:16px;font-size:13px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
select{padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:13px}
.day{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:22px 0 8px;display:flex;gap:8px;align-items:center}
.day:after{content:"";flex:1;height:1px;background:var(--line)}
.item{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:8px;padding:12px 16px;margin-bottom:8px;position:relative}
.item.k-paper{border-left-color:var(--paper)}.item.k-job{border-left-color:var(--job)}.item.k-news{border-left-color:var(--news)}
.item .t{font-weight:600;font-size:15px;text-decoration:none;padding-right:28px;display:block}.item .t:hover{color:var(--accent)}
.item .m{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:5px;font-size:12.5px;color:var(--muted)}
.tag{background:var(--chip);color:var(--text);border-radius:4px;padding:1px 7px;font-size:11.5px;font-weight:500}
.tag.tier{background:#1f6feb1a;color:var(--paper)}.tag.hot{background:#c2410c1a;color:var(--hot)}.tag.dl{background:#0e8a5f1a;color:var(--job)}
.item p{margin:6px 0 0;color:var(--muted);font-size:13.5px}
.star{position:absolute;top:10px;right:10px;background:none;border:0;font-size:17px;cursor:pointer;color:var(--muted)}
.star.on{color:#e3a400}
.empty{text-align:center;color:var(--muted);padding:50px 0}
.pop{position:absolute;z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px #0003;padding:10px;width:250px}
.pop h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.pop label{display:flex;gap:8px;align-items:center;padding:5px 4px;border-radius:6px;cursor:pointer;font-size:14px}
.pop label:hover{background:var(--chip)}.pop .new{display:flex;gap:6px;margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
.pop input[type=text]{flex:1;min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:6px;padding:5px 10px;font-size:13px;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}.btn.del{color:#d1242f}
.folderbar{display:flex;gap:8px;align-items:center;margin:-4px 0 14px;color:var(--muted);font-size:13px}
.conf{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.conf .hd{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;justify-content:space-between}
.conf .nm{font-weight:700;font-size:15.5px;text-decoration:none}.conf .nm:hover{color:var(--accent)}
.conf .full{color:var(--muted);font-size:12.5px;margin-top:2px}
.st{font-size:12px;font-weight:600;border-radius:12px;padding:2px 10px;white-space:nowrap}
.st.open{background:#0e8a5f1f;color:var(--job)}.st.soon{background:#c2410c1f;color:var(--hot)}.st.up{background:#1f6feb1a;color:var(--accent)}.st.closed{background:var(--chip);color:var(--muted)}
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 14px;margin-top:10px;font-size:12.5px}
.dl div{border-left:2px solid var(--line);padding-left:8px}.dl b{display:block;font-size:13.5px;color:var(--text)}.dl span{color:var(--muted)}
.dl .past b{color:var(--muted);text-decoration:line-through}.dl .next{border-left-color:var(--hot)}.dl .next b{color:var(--hot)}
.conf .nt{margin-top:8px;font-size:12.5px;color:var(--muted)}
.hint{color:var(--muted);font-size:12.5px;margin:-6px 0 14px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:30px}
</style>
</head>
<body>
<div class="top">
  <div class="in">
    <div class="logo"><img src="icon.svg" alt=""><div>GNSS Pulse<small>Satellite navigation research, jobs &amp; industry</small></div></div>
    <div class="search"><input id="q" placeholder="Search papers, jobs, news…" autocomplete="off"></div>
  </div>
  <nav id="tabs"></nav>
</div>
<main id="view"></main>
<footer>Updated automatically 4× daily from OpenAlex, arXiv, journals, EURAXESS, ESA, ISRO, EUSPA and more.</footer>
<script>
const KIND={paper:"paper",preprint:"paper",conference:"paper",book_chapter:"paper",thesis:"paper",article:"paper",
  job:"job",phd:"job",postdoc:"job",internship:"job"};
const kind=i=>KIND[i.category]||"news";
const LABEL={paper:"Journal",preprint:"Preprint",conference:"Conference",book_chapter:"Book chapter",thesis:"Thesis",
  job:"Job",phd:"PhD",postdoc:"Postdoc",internship:"Internship",news:"News",product:"Product",event:"Event",cfp:"Call for papers",
  dataset:"Dataset",software:"Software",other:"Other"};
const TABS=[["overview","Today"],["paper","Papers"],["job","Jobs"],["news","News & Industry"],["calls","Calls for Papers"],["saved","Saved"]];
let cfp={conferences:[],special_issues:[],wikicfp:[]},callView="conf";
const today=new Date().toISOString().slice(0,10);
const daysTo=d=>Math.round((new Date(d+"T00:00")-new Date(today+"T00:00"))/864e5);
const fmt=d=>d?new Date(d+"T00:00").toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}):"TBA";
const DL=[["submission_opens","Submission opens"],["abstract_deadline","Abstract deadline"],["full_paper_deadline","Full paper deadline"],
  ["notification","Notification"],["camera_ready","Camera-ready"],["start","Conference starts"]];
function confStatus(c){
  const subs=["abstract_deadline","full_paper_deadline"].map(k=>c[k]).filter(Boolean).sort();
  const next=subs.find(d=>d>=today);
  if(next){const n=daysTo(next);
    if(c.submission_opens&&c.submission_opens>today)return["up",`Opens ${fmt(c.submission_opens)}`,next];
    return[n<=14?"soon":"open",n==0?"Closes today":`Open · closes in ${n} day${n>1?"s":""}`,next]}
  if(c.start&&c.start>=today)return["closed","Submissions closed · conference "+fmt(c.start),"9"+c.start];
  return["closed",c.edition?"Closed · next edition TBA":"Dates TBA","99"]}
function confCard(c){const[st,label]=confStatus(c);const nextKey=DL.map(([k])=>k).find(k=>c[k]&&c[k]>=today);
  return`<div class="conf"><div class="hd"><div><a class="nm" href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.edition||c.short)}</a>
    <span class="tag">${esc(c.rank||"")}</span> <span class="tag">${esc(c.area||"")}</span>
    <div class="full">${esc(c.name)}${c.start?` · ${fmt(c.start)}${c.end&&c.end!=c.start?" – "+fmt(c.end):""}`:""}${c.location?" · 📍 "+esc(c.location):""}</div></div>
    <span class="st ${st}">${label}</span></div>
    ${DL.some(([k])=>c[k])?`<div class="dl">${DL.filter(([k])=>c[k]).map(([k,l])=>`<div class="${c[k]<today?"past":k==nextKey?"next":""}"><span>${l}</span><b>${fmt(c[k])}</b></div>`).join("")}</div>`
      :`<div class="nt">Dates not published yet. <a href="${esc(c.url)}" target="_blank" rel="noopener">Check the official site →</a></div>`}
    ${c.submission_type||c.publication||c.notes?`<div class="nt">${[c.submission_type&&"Submission: "+esc(c.submission_type),c.publication&&"Published in: "+esc(c.publication),esc(c.notes||"")].filter(Boolean).join(" · ")}</div>`:""}
    ${c.checked?`<div class="nt" style="font-size:11.5px">Dates read from the official page on ${fmt(c.checked)}. Always confirm on the site.</div>`:""}</div>`}
const SUB={paper:["paper","conference","preprint","book_chapter","thesis"],job:["phd","postdoc","job","internship"],
  news:["news","product","event","cfp","dataset","software"]};
let items=[],updated,tab=location.hash.slice(1)||"overview",sub="",region="",days=30;
// Saved folders live in this browser: {folder name: [item ids]}, plus a copy of each saved item
let folders=JSON.parse(localStorage.folders||"null")||{"General":JSON.parse(localStorage.saved||"[]")};
const savedData=JSON.parse(localStorage.savedData||"{}");
let folder="";  // selected folder in Saved tab ("" = all)
const store=()=>{localStorage.folders=JSON.stringify(folders);localStorage.savedData=JSON.stringify(savedData)};
const isSaved=id=>Object.values(folders).some(f=>f.includes(id));
const savedIds=()=>new Set(Object.values(folders).flat());
function toggle(name,id){const f=folders[name];const k=f.indexOf(id);k<0?f.push(id):f.splice(k,1);
  if(isSaved(id)){const it=items.find(i=>i.id==id);if(it)savedData[id]=it}else delete savedData[id];store()}
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const when=i=>(i.date&&i.date<=i.added.slice(0,10)?i.date:i.added.slice(0,10));
const isNew=i=>Date.now()-new Date(i.added)<864e5;
function dayLabel(d){const t=new Date().toISOString().slice(0,10),y=new Date(Date.now()-864e5).toISOString().slice(0,10);
  return d==t?"Today":d==y?"Yesterday":new Date(d+"T00:00").toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short",year:"numeric"})}
function matches(i){const q=$("#q").value.trim().toLowerCase();
  return !q||[i.title,i.venue,i.source,i.ai_summary,i.summary,i.location].join(" ").toLowerCase().includes(q)}
const byDate=(a,b)=>when(b).localeCompare(when(a))||b.added.localeCompare(a.added);

function card(i){const k=kind(i),s=isSaved(i.id);
  return `<div class="item k-${k}"><button class="star ${s?"on":""}" data-star="${i.id}" title="Save to folder">${s?"★":"☆"}</button>
  <a class="t" href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a>
  <div class="m"><span class="tag">${esc(LABEL[i.category]||i.category)}</span>
   ${i.tier&&!["unknown","conference","preprint","book"].includes(i.tier)?`<span class="tag tier">${esc(i.tier)}</span>`:""}
   ${i.importance>=4?`<span class="tag hot">Key</span>`:""}
   ${i.deadline?`<span class="tag dl">Deadline ${esc(i.deadline)}</span>`:""}
   <span>${esc(i.venue||i.source)}</span>
   ${k=="job"&&(i.location||i.region)?`<span>· 📍 ${esc(i.location||i.region)}</span>`:""}
   ${i.date?`<span>· ${esc(i.date)}</span>`:""}</div>
  ${i.ai_summary||i.summary?`<p>${esc(i.ai_summary||i.summary.slice(0,280)+(i.summary.length>280?"…":""))}</p>`:""}</div>`}

function list(rows){if(!rows.length)return`<div class="empty">No items match these filters.</div>`;
  let out="",last="";for(const i of rows){const d=when(i);if(d!=last){out+=`<div class="day">${dayLabel(d)}</div>`;last=d}out+=card(i)}return out}

function panel(title,t,rows,n=6){return`<div class="panel"><h3>${title}<a data-go="${t}">View all →</a></h3>
  ${rows.slice(0,n).map(i=>`<div class="row"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a>
  <div class="sub">${esc(LABEL[i.category]||i.category)} · ${esc(i.venue||i.source)}${kind(i)=="job"&&i.region?" · "+esc(i.region):""}</div></div>`).join("")
  ||`<div class="row sub">Nothing new in the last 24 hours.</div>`}</div>`}

function render(){
  history.replaceState(null,"","#"+tab);
  const all=items.filter(matches),count=k=>all.filter(i=>kind(i)==k).length;
  $("#tabs").innerHTML=TABS.map(([k,l])=>`<button data-tab="${k}" class="${tab==k?"on":""}">${l}${
    k=="overview"?`<span class="n">${all.filter(isNew).length}</span>`:k=="saved"?`<span class="n">${savedIds().size}</span>`:k=="calls"?`<span class="n">${cfp.conferences.filter(c=>confStatus(c)[0]!="closed").length}</span>`:`<span class="n">${count(k)}</span>`}</button>`).join("");
  const meta=`<div class="meta">${items.length} items tracked · last updated ${updated?new Date(updated).toLocaleString(undefined,{dateStyle:"medium",timeStyle:"short"}):"n/a"}</div>`;
  let html=meta;
  if(tab=="overview"){
    const fresh=all.filter(isNew).sort((a,b)=>b.importance-a.importance||byDate(a,b));
    const recent=k=>{const f=fresh.filter(i=>kind(i)==k);return f.length?f:all.filter(i=>kind(i)==k).sort(byDate)};
    const t=k=>fresh.filter(i=>kind(i)==k).length;
    html+=`<div class="tiles">
      <div class="tile" data-go="paper"><b style="color:var(--paper)">${t("paper")}</b><span>New papers today</span></div>
      <div class="tile" data-go="job"><b style="color:var(--job)">${t("job")}</b><span>New positions today</span></div>
      <div class="tile" data-go="news"><b style="color:var(--news)">${t("news")}</b><span>News &amp; industry today</span></div>
      <div class="tile" data-go="job" data-region="India"><b>${all.filter(i=>kind(i)=="job"&&i.region=="India").length}</b><span>Open positions in India</span></div>
      <div class="tile" data-go="job" data-region="Europe"><b>${all.filter(i=>kind(i)=="job"&&i.region=="Europe").length}</b><span>Open positions in Europe</span></div></div>
      ${(()=>{const up=cfp.conferences.map(c=>[c,confStatus(c)]).filter(([,s])=>s[0]=="open"||s[0]=="soon"||s[0]=="up").sort((a,b)=>a[1][2].localeCompare(b[1][2])).slice(0,4);
      return up.length?`<div class="panel" style="margin-bottom:18px"><h3>📢 Upcoming deadlines<a data-go="calls">All calls →</a></h3>${up.map(([c,s])=>`<div class="row"><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.edition||c.short)}</a> <span class="st ${s[0]}">${s[1]}</span><div class="sub">${esc(c.name)}${c.location?" · "+esc(c.location):""}</div></div>`).join("")}</div>`:""})()}
      <div class="grid">${panel("📄 Latest papers","paper",recent("paper"),8)}${panel("💼 Latest positions","job",recent("job"))}${panel("📰 News & industry","news",recent("news"))}</div>`;
  }else if(tab=="calls"){
    const q=$("#q").value.trim().toLowerCase(),m=o=>!q||JSON.stringify(o).toLowerCase().includes(q);
    const si=[...cfp.special_issues.map(x=>({...x,kind:"journal"})),...cfp.wikicfp.filter(x=>x.kind=="journal")].filter(m);
    const wc=cfp.wikicfp.filter(x=>x.kind=="conference").filter(m);
    html+=`<div class="filters">${[["conf",`Conferences (${cfp.conferences.length})`],["journal",`Journal special issues (${si.length})`],["more",`More calls (${wc.length})`]].map(([k,l])=>
      `<button class="chip ${callView==k?"on":""}" data-call="${k}">${l}</button>`).join("")}</div>`;
    if(callView=="conf"){html+=`<div class="hint">Major GNSS / navigation / geodesy conferences, sorted by the next submission deadline.</div>`+
      cfp.conferences.filter(m).sort((a,b)=>confStatus(a)[2].localeCompare(confStatus(b)[2])).map(confCard).join("")}
    else if(callView=="journal"){html+=`<div class="hint">Open calls for special issues in Q1/Q2 journals (IEEE Transactions &amp; journals, WikiCFP). Open the notice for deadline and guest editors.</div>`+
      (si.sort((a,b)=>(b.posted||"").localeCompare(a.posted||"")).map(x=>`<div class="item k-paper"><a class="t" href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a>
        <div class="m">${x.tier?`<span class="tag tier">${esc(x.tier)}</span>`:""}<span>${esc(x.journal||x.source)}</span>${x.posted?`<span>· posted ${fmt(x.posted)}</span>`:""}${x.when?`<span>· ${esc(x.when)}</span>`:""}</div>
        ${x.summary?`<p>${esc(x.summary)}</p>`:""}</div>`).join("")||`<div class="empty">No open special-issue calls found right now.</div>`)}
    else html+=`<div class="hint">Other GNSS-related calls from WikiCFP (workshops, smaller conferences). Check quality before submitting.</div>`+
      (wc.map(x=>`<div class="item"><a class="t" href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a><p>${esc(x.summary)}</p></div>`).join("")||`<div class="empty">Nothing right now.</div>`);
  }else{
    let rows;
    if(tab=="saved"){
      if(folder&&!folders[folder])folder="";
      const pool=[...new Map([...Object.values(savedData),...items].map(i=>[i.id,i])).values()].filter(matches);
      const ids=folder?new Set(folders[folder]):savedIds();rows=pool.filter(i=>ids.has(i.id));
      html+=`<div class="filters"><button class="chip ${folder?"":"on"}" data-folder="">All saved (${savedIds().size})</button>${
        Object.keys(folders).map(f=>`<button class="chip ${folder==f?"on":""}" data-folder="${esc(f)}">📁 ${esc(f)} (${folders[f].length})</button>`).join("")}
        <button class="btn" data-act="newfolder">+ New folder</button></div>
        ${folder?`<div class="folderbar">📁 <b>${esc(folder)}</b><button class="btn" data-act="rename">Rename</button><button class="btn del" data-act="delete">Delete folder</button></div>`:""}`;
    }else rows=all.filter(i=>kind(i)==tab);
    if(SUB[tab]){
      const present=SUB[tab].filter(c=>rows.some(i=>i.category==c));
      html+=`<div class="filters"><button class="chip ${sub?"":"on"}" data-sub="">All</button>${present.map(c=>
        `<button class="chip ${sub==c?"on":""}" data-sub="${c}">${LABEL[c]} (${rows.filter(i=>i.category==c).length})</button>`).join("")}
        ${tab=="job"?`<span class="sep"></span>${["","India","Europe","Other"].map(r=>`<button class="chip ${region==r?"on":""}" data-region="${r}">${r||"🌍 All regions"}</button>`).join("")}`:""}
        <span class="sep"></span><select id="days">${[[1,"Last 24 h"],[7,"Last 7 days"],[30,"Last 30 days"],[9999,"All time"]].map(([v,l])=>`<option value="${v}" ${days==v?"selected":""}>${l}</option>`).join("")}</select></div>`;
      if(sub)rows=rows.filter(i=>i.category==sub);
      if(tab=="job"&&region)rows=rows.filter(i=>(i.region||"Other")==region);
      const cut=new Date(Date.now()-days*864e5).toISOString();rows=rows.filter(i=>i.added>=cut);
    }
    html+=list(rows.sort(byDate));
  }
  $("#view").innerHTML=html;
}
function closePop(){document.querySelector(".pop")?.remove()}
function openPop(btn,id){closePop();const p=document.createElement("div");p.className="pop";p.dataset.id=id;
  const draw=()=>{p.innerHTML=`<h4>Save to folder</h4>${Object.keys(folders).map(f=>
    `<label><input type="checkbox" data-pf="${esc(f)}" ${folders[f].includes(id)?"checked":""}> 📁 ${esc(f)}</label>`).join("")}
    <div class="new"><input type="text" placeholder="New folder name" maxlength="40"><button class="btn pri" data-pnew>Create</button></div>`};
  draw();document.body.appendChild(p);
  const r=btn.getBoundingClientRect();p.style.top=(scrollY+r.bottom+4)+"px";p.style.left=Math.max(8,Math.min(scrollX+r.right-250,innerWidth-262))+"px";
  p.addEventListener("click",e=>{e.stopPropagation();
    if(e.target.dataset.pf!==undefined){toggle(e.target.dataset.pf,id);render(true)}
    if(e.target.dataset.pnew!==undefined){const n=p.querySelector("input[type=text]").value.trim();
      if(n&&!folders[n]){folders[n]=[];toggle(n,id);draw();render(true)}}});
  p.querySelector("input[type=text]").addEventListener("keydown",e=>{if(e.key=="Enter")p.querySelector("[data-pnew]").click()})}
document.addEventListener("click",e=>{
  if(!e.target.closest(".pop"))closePop();
  const d=e.target.closest("[data-tab],[data-go],[data-sub],[data-region],[data-star],[data-folder],[data-act],[data-call]");if(!d)return;
  if(d.dataset.call){callView=d.dataset.call;render();return}
  if(d.dataset.star){openPop(d,d.dataset.star);return}
  if(d.dataset.folder!==undefined)folder=d.dataset.folder;
  else if(d.dataset.act=="newfolder"){const n=prompt("Folder name:")?.trim();if(n&&!folders[n]){folders[n]=[];store();folder=n}}
  else if(d.dataset.act=="rename"){const n=prompt("Rename folder:",folder)?.trim();
    if(n&&n!=folder&&!folders[n]){folders[n]=folders[folder];delete folders[folder];folder=n;store()}}
  else if(d.dataset.act=="delete"){if(confirm(`Delete folder "${folder}"? Items saved only in it will be unsaved.`)){
    const ids=folders[folder];delete folders[folder];ids.forEach(id=>{if(!isSaved(id))delete savedData[id]});folder="";store()}}
  else if(d.dataset.tab||d.dataset.go){tab=d.dataset.tab||d.dataset.go;sub="";region=d.dataset.region||"";scrollTo(0,0)}
  else if(d.dataset.sub!==undefined)sub=d.dataset.sub;
  else if(d.dataset.region!==undefined)region=d.dataset.region;
  render()});
document.addEventListener("change",e=>{if(e.target.id=="days"){days=+e.target.value;render()}});
$("#q").addEventListener("input",render);
fetch("data/calls.json?"+Date.now()).then(r=>r.json()).then(d=>{cfp=d;if(items.length)render()}).catch(()=>{});
fetch("data/items.json?"+Date.now()).then(r=>r.json()).then(d=>{items=d.items;updated=d.updated;render()})
  .catch(()=>{$("#view").innerHTML=`<div class="empty">No data yet. The collector hasn't run.</div>`});
</script>
</body>
</html>
