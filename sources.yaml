# Edit this file to add feeds/keywords — no code changes needed.
lookback_days: 3

keywords:
  strong:   # any one of these => GNSS-related
    - gnss
    - global navigation satellite
    - satellite navigation
    - galileo satellite
    - glonass
    - beidou
    - navic
    - irnss
    - qzss
    - sbas
    - precise point positioning
    - ppp-rtk
    - real-time kinematic
    - gnss reflectometry
    - gnss-r
    - radio occultation
    - pseudorange
    - carrier phase
    - leo pnt
    - positioning, navigation and timing
    - spoofing
    - jamming
  weak:     # need a second context word
    - gps
    - rtk
    - ppp
    - positioning
    - navigation
    - ionospher
    - tec
    - multipath
    - geodesy
    - receiver
  context:
    - satellite
    - signal
    - receiver
    - orbit
    - clock
    - antenna
    - ionospher
    - geodetic
    - positioning
    - integrity
    - ins
    - inertial
  exclude:  # noise
    - gps tracking of patients
    - gps collar
    - animal movement
    - wildlife tracking
    - gprs

openalex_queries:
  - GNSS
  - "satellite navigation"
  - "precise point positioning"
  - "GNSS reflectometry"
  - "GNSS spoofing"
  - BeiDou
  - NavIC

arxiv_queries:
  - all:GNSS
  - all:"satellite navigation"
  - all:"precise point positioning"

rss:
  papers:
    - name: GPS Solutions
      trusted: true
      url: https://link.springer.com/search.rss?facet-journal-id=10291&channel-name=GPS%20Solutions
    - name: Journal of Geodesy
      trusted: true
      url: https://link.springer.com/search.rss?facet-journal-id=190&channel-name=Journal%20of%20Geodesy
    - name: NAVIGATION (ION)
      trusted: true
      url: https://navi.ion.org/rss/current.xml
    # MDPI (Remote Sensing, Sensors) blocks RSS bots; covered via OpenAlex.
  jobs:
    - name: GNSS postdoc
      url: https://news.google.com/rss/search?hl=en&q=GNSS+postdoc
    - name: GNSS PhD position
      url: https://news.google.com/rss/search?hl=en&q=GNSS+%22PhD+position%22
    - name: GNSS internship
      url: https://news.google.com/rss/search?hl=en&q=GNSS+internship
    - name: GNSS engineer jobs
      url: https://news.google.com/rss/search?hl=en&q=%22GNSS+engineer%22+OR+%22navigation+engineer%22+hiring
    - name: Satellite navigation careers
      url: https://news.google.com/rss/search?hl=en&q=%22satellite+navigation%22+(vacancy+OR+career+OR+recruitment)
    - name: Google News India GNSS jobs
      url: https://news.google.com/rss/search?hl=en-IN&gl=IN&ceid=IN:en&q=(GNSS+OR+NavIC+OR+%22satellite+navigation%22+OR+ISRO)+(JRF+OR+SRF+OR+%22project+associate%22+OR+%22project+scientist%22+OR+recruitment+OR+vacancy+OR+internship)
  news:
    - name: Google News GNSS
      url: https://news.google.com/rss/search?hl=en&q=GNSS+OR+%22satellite+navigation%22+OR+NavIC+OR+BeiDou+OR+Galileo+satellite
    - name: Inside GNSS
      trusted: true
      url: https://insidegnss.com/feed/
    - name: EUSPA
      trusted: true
      url: https://www.euspa.europa.eu/rss.xml
    - name: GPS.gov
      trusted: true
      url: https://www.gps.gov/rss.xml
    - name: ESA Navigation
      trusted: true
      url: https://www.esa.int/rssfeed/Our_Activities/Navigation
    - name: IGS
      trusted: true
      url: https://igs.org/feed/
    - name: RNTF (Resilient PNT)
      trusted: true
      url: https://rntfnd.org/feed/
    - name: SpaceNews
      url: https://spacenews.com/feed/
    - name: Google News GNSS products
      url: https://news.google.com/rss/search?hl=en&q=GNSS+receiver+(launch+OR+launches+OR+unveils+OR+introduces)
    - name: Google News NavIC / ISRO
      url: https://news.google.com/rss/search?hl=en&q=NavIC+OR+%22ISRO+navigation%22
    - name: Google News LEO-PNT / jamming / spoofing
      url: https://news.google.com/rss/search?hl=en&q=%22LEO+PNT%22+OR+%22GPS+jamming%22+OR+%22GNSS+spoofing%22

# Job search result pages (scraped). link = regex for posting links.
job_pages:
  - name: EURAXESS (GNSS)
    url: https://euraxess.ec.europa.eu/jobs/search?f%5B0%5D=keywords%3AGNSS
    link: ^/jobs/\d+$
  - name: EURAXESS (satellite navigation)
    url: https://euraxess.ec.europa.eu/jobs/search?f%5B0%5D=keywords%3Asatellite%20navigation
    link: ^/jobs/\d+$
  - name: EURAXESS (Galileo)
    url: https://euraxess.ec.europa.eu/jobs/search?f%5B0%5D=keywords%3AGalileo
    link: ^/jobs/\d+$
  - name: EURAXESS (geodesy)
    url: https://euraxess.ec.europa.eu/jobs/search?f%5B0%5D=keywords%3Ageodesy
    link: ^/jobs/\d+$
  - name: EURAXESS (navigation)
    url: https://euraxess.ec.europa.eu/jobs/search?f%5B0%5D=keywords%3Anavigation
    link: ^/jobs/\d+$
  - name: ISRO Careers (India)
    url: https://www.isro.gov.in/Careers.html
    link: (?i)recruit
    title_include: inviting|applications|recruitment of|apprentice|fellow|JRF|walk-in
  - name: ESA Jobs (navigation)
    url: https://jobs.esa.int/search/?q=navigation
    link: ^/job/
  - name: ESA Jobs (GNSS)
    url: https://jobs.esa.int/search/?q=GNSS
    link: ^/job/
  - name: Nature Careers (GNSS)
    url: https://www.nature.com/naturecareers/jobs/?keywords=GNSS
    link: /naturecareers/job/\d+
