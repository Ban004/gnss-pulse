# Edit this file to add feeds/keywords — no code changes needed.
lookback_days: 3

keywords:
  strong:   # any one of these => GNSS-related
    - gnss
    - global navigation satellite
    - satellite navigation
    - galileo satellite
    - glonass
    - beidou
    - navic
    - irnss
    - qzss
    - sbas
    - precise point positioning
    - ppp-rtk
    - real-time kinematic
    - gnss reflectometry
    - gnss-r
    - radio occultation
    - pseudorange
    - carrier phase
    - leo pnt
    - positioning, navigation and timing
    - spoofing
    - jamming
  weak:     # need a second context word
    - gps
    - rtk
    - ppp
    - positioning
    - navigation
    - ionospher
    - tec
    - multipath
    - geodesy
    - receiver
  context:
    - satellite
    - signal
    - receiver
    - orbit
    - clock
    - antenna
    - ionospher
    - geodetic
    - positioning
    - integrity
    - ins
    - inertial
  exclude:  # noise
    - gps tracking of patients
    - gps collar
    - animal movement
    - wildlife tracking
    - gprs

openalex_queries:
  - GNSS
  - "satellite navigation"
  - "precise point positioning"
  - "GNSS reflectometry"
  - "GNSS spoofing"
  - BeiDou
  - NavIC

# Crossref: all publishers (IEEE, Elsevier, Springer, Wiley, MDPI, T&F, ION…), all tiers
crossref:
  lookback_days: 10
  queries:
    - GNSS
    - satellite navigation
    - precise point positioning
    - GNSS reflectometry
    - GPS BeiDou Galileo positioning
    - GNSS spoofing jamming interference
  journal_query: GNSS GPS BeiDou Galileo satellite navigation positioning PNT ionosphere
  journals:   # IEEE journals & transactions
    - {name: IEEE Trans. Aerospace & Electronic Systems, issn: 0018-9251}
    - {name: IEEE Trans. Geoscience & Remote Sensing, issn: 0196-2892}
    - {name: IEEE Trans. Instrumentation & Measurement, issn: 0018-9456}
    - {name: IEEE Trans. Vehicular Technology, issn: 0018-9545}
    - {name: IEEE Trans. Intelligent Transportation Systems, issn: 1524-9050}
    - {name: IEEE Trans. Signal Processing, issn: 1053-587X}
    - {name: IEEE Sensors Journal, issn: 1530-437X}
    - {name: IEEE Internet of Things Journal, issn: 2327-4662}
    - {name: IEEE JSTARS, issn: 1939-1404}
    - {name: IEEE Geoscience & Remote Sensing Letters, issn: 1545-598X}
    - {name: IEEE Aerospace & Electronic Systems Magazine, issn: 0885-8985}
    - {name: IEEE J. Indoor & Seamless Positioning and Navigation, issn: 2832-7322}
    - {name: IEEE Access, issn: 2169-3536}
    # Core GNSS journals (also in RSS; Crossref makes sure nothing is missed)
    - {name: GPS Solutions, issn: 1080-5370}
    - {name: Journal of Geodesy, issn: 0949-7714}
    - {name: NAVIGATION (ION), issn: 0028-1522}
    - {name: Satellite Navigation, issn: 2662-9291}
    - {name: Journal of Navigation, issn: 0373-4633}
  conferences:  # IEEE conference proceedings (PLANS, IGARSS, ITSC, VTC, ICC…)
    - name: IEEE conferences
      query: GNSS GPS satellite navigation positioning
      filter: member:263,type:proceedings-article

arxiv_queries:
  - all:GNSS
  - all:"satellite navigation"
  - all:"precise point positioning"

rss:
  papers:
    - name: GPS Solutions
      trusted: true
      url: https://link.springer.com/search.rss?facet-journal-id=10291&channel-name=GPS%20Solutions
    - name: Journal of Geodesy
      trusted: true
      url: https://link.springer.com/search.rss?facet-journal-id=190&channel-name=Journal%20of%20Geodesy
    - name: NAVIGATION (ION)
      trusted: true
      url: https://navi.ion.org/rss/current.xml
    # MDPI (Remote Sensing, Sensors) blocks RSS bots; covered via OpenAlex.
  jobs:
    - name: GNSS postdoc
      url: https://news.google.com/rss/search?hl=en&q=GNSS+postdoc
    - name: GNSS PhD position
      url: https://news.google.com/rss/search?hl=en&q=GNSS+%22PhD+position%22
    - name: GNSS internship
      url: https://news.google.com/rss/search?hl=en&q=GNSS+internship
    - name: GNSS engineer jobs
      url: https://news.google.com/rss/search?hl=en&q=%22GNSS+engineer%22+OR+%22navigation+engineer%22+hiring
    - name: Satellite navigation careers
      url: https://news.google.com/rss/search?hl=en&q=%22satellite+navigation%22+(vacancy+OR+career+OR+recruitment)
    - name: Google News India GNSS jobs
      url: https://news.google.com/rss/search?hl=en-IN&gl=IN&ceid=IN:en&q=(GNSS+OR+NavIC+OR+%22satellite+navigation%22+OR+ISRO)+(JRF+OR+SRF+OR+%22project+associate%22+OR+%22project+scientist%22+OR+recruitment+OR+vacancy+OR+internship)
  news:
    - name: Google News GNSS
      url: https://news.google.com/rss/search?hl=en&q=GNSS+OR+%22satellite+navigation%22+OR+NavIC+OR+BeiDou+OR+Galileo+satellite
    - name: Inside GNSS
      trusted: true
      url: https://insidegnss.com/feed/
    - name: EUSPA
      trusted: true
      url: https://www.euspa.europa.eu/rss.xml
    - name: GPS.gov
      trusted: true
      url: https://www.gps.gov/rss.xml
    - name: ESA Navigation
      trusted: true
      url: https://www.esa.int/rssfeed/Our_Activities/Navigation
    - name: IGS
      trusted: true
      url: https://igs.org/feed/
    - name: RNTF (Resilient PNT)
      trusted: true
      url: https://rntfnd.org/feed/
    - name: SpaceNews
      url: https://spacenews.com/feed/
    - name: Google News GNSS products
      url: https://news.google.com/rss/search?hl=en&q=GNSS+receiver+(launch+OR+launches+OR+unveils+OR+introduces)
    - name: Google News NavIC / ISRO
      url: https://news.google.com/rss/search?hl=en&q=NavIC+OR+%22ISRO+navigation%22
    - name: Google News LEO-PNT / jamming / spoofing
      url: https://news.google.com/rss/search?hl=en&q=%22LEO+PNT%22+OR+%22GPS+jamming%22+OR+%22GNSS+spoofing%22

# Job search result pages (scraped). link = regex for posting links.
job_pages:
  - name: EURAXESS (GNSS)
    url: https://euraxess.ec.europa.eu/jobs/search?f%5B0%5D=keywords%3AGNSS
    link: ^/jobs/\d+$
  - name: EURAXESS (satellite navigation)
    url: https://euraxess.ec.europa.eu/jobs/search?f%5B0%5D=keywords%3Asatellite%20navigation
    link: ^/jobs/\d+$
  - name: EURAXESS (Galileo)
    url: https://euraxess.ec.europa.eu/jobs/search?f%5B0%5D=keywords%3AGalileo
    link: ^/jobs/\d+$
  - name: EURAXESS (geodesy)
    url: https://euraxess.ec.europa.eu/jobs/search?f%5B0%5D=keywords%3Ageodesy
    link: ^/jobs/\d+$
  - name: EURAXESS (navigation)
    url: https://euraxess.ec.europa.eu/jobs/search?f%5B0%5D=keywords%3Anavigation
    link: ^/jobs/\d+$
  - name: ISRO Careers (India)
    url: https://www.isro.gov.in/Careers.html
    link: (?i)recruit
    title_include: inviting|applications|recruitment of|apprentice|fellow|JRF|walk-in
  - name: ESA Jobs (navigation)
    url: https://jobs.esa.int/search/?q=navigation
    link: ^/job/
  - name: ESA Jobs (GNSS)
    url: https://jobs.esa.int/search/?q=GNSS
    link: ^/job/
  - name: Nature Careers (GNSS)
    url: https://www.nature.com/naturecareers/jobs/?keywords=GNSS
    link: /naturecareers/job/\d+

# Journal quartiles (SCImago SJR, best category). Shown as the Q-badge in the app.
# Matched against the venue name (case-insensitive substring; prefix "=" for exact match). Journals not listed show no quartile.
# Edit/extend freely.
journal_quartiles:
  ieee transactions on aerospace and electronic systems: Q1
  ieee transactions on geoscience and remote sensing: Q1
  ieee transactions on instrumentation and measurement: Q1
  ieee transactions on vehicular technology: Q1
  ieee transactions on intelligent transportation systems: Q1
  ieee transactions on signal processing: Q1
  ieee transactions on industrial informatics: Q1
  ieee transactions on industrial electronics: Q1
  ieee transactions on wireless communications: Q1
  ieee sensors journal: Q1
  ieee internet of things journal: Q1
  ieee journal of selected topics in applied earth observations: Q1
  ieee geoscience and remote sensing letters: Q1
  ieee access: Q1
  gps solutions: Q1
  journal of geodesy: Q1
  "navigation: journal of the institute of navigation": Q1
  navigation (ion): Q1
  remote sensing of environment: Q1
  isprs journal of photogrammetry: Q1
  "=measurement": Q1          # "=" means exact name only (Elsevier Measurement)
  space weather: Q1
  "=remote sensing": Q1       # MDPI Remote Sensing, exact name only

# ── Calls for papers ─────────────────────────────────────────────
# Conferences: dates are AI-extracted daily from the official pages (only dates written there).
calls:
  conferences:
    - {name: ION GNSS+ (Intl. Technical Meeting of the ION Satellite Division), short: ION GNSS+, rank: Flagship, area: GNSS,
       url: "https://www.ion.org/gnss/", pages: ["https://www.ion.org/gnss/call-for-abstracts.cfm"]}
    - {name: IEEE/ION Position Location and Navigation Symposium, short: PLANS, rank: Flagship, area: PNT,
       url: "https://www.ion.org/plans/", pages: ["https://www.ion.org/plans/call-for-abstracts.cfm"]}
    - {name: ION International Technical Meeting, short: ION ITM, rank: Major, area: PNT,
       url: "https://www.ion.org/itm/", pages: ["https://www.ion.org/itm/call-for-abstracts.cfm"]}
    - {name: ION Joint Navigation Conference, short: ION JNC, rank: Major, area: PNT (defense),
       url: "https://www.ion.org/jnc/", pages: ["https://www.ion.org/jnc/call-for-abstracts.cfm"]}
    - {name: ION Pacific PNT Meeting, short: Pacific PNT, rank: Major, area: PNT,
       url: "https://www.ion.org/pnt/", pages: ["https://www.ion.org/pnt/call-for-abstracts.cfm"]}
    - {name: European Navigation Conference, short: ENC, rank: Flagship, area: GNSS/PNT (Europe),
       url: "https://enc-series.org/"}
    - {name: Indoor Positioning and Indoor Navigation (IEEE), short: IPIN, rank: Major, area: Positioning,
       url: "https://ipin-conference.org/"}
    - {name: Intl. Conference on Localization and GNSS, short: ICL-GNSS, rank: Major, area: GNSS,
       url: "https://events.tuni.fi/icl-gnss/"}
    - {name: IEEE Intl. Geoscience and Remote Sensing Symposium, short: IGARSS, rank: Flagship, area: GNSS-R / remote sensing,
       url: "https://2027.ieeeigarss.org/", pages: ["https://2027.ieeeigarss.org/", "https://2027.ieeeigarss.org/important_dates.php"]}
    - {name: IEEE India Geoscience and Remote Sensing Symposium, short: InGARSS, rank: Major, area: Remote sensing (India),
       url: "https://ingarss2026.co.in/"}
    - {name: IEEE Aerospace Conference, short: AeroConf, rank: Major, area: Aerospace / navigation,
       url: "https://aeroconf.org/"}
    - {name: Intl. Conference on Information Fusion, short: FUSION, rank: Major, area: Sensor fusion / navigation,
       url: "https://fusion2027.org/"}
    - {name: IEEE Intl. Conference on Acoustics, Speech and Signal Processing, short: ICASSP, rank: Flagship, area: Signal processing,
       url: "https://2027.ieeeicassp.org/"}
    - {name: IEEE Intelligent Transportation Systems Conference, short: ITSC, rank: Major, area: Vehicle positioning,
       url: "https://www.ieee-itsc.org/"}
    - {name: EGU General Assembly, short: EGU, rank: Flagship, area: Geodesy / ionosphere,
       url: "https://www.egu27.eu/"}
    - {name: AGU Annual Meeting, short: AGU, rank: Flagship, area: Geodesy / space weather,
       url: "https://www.agu.org/annual-meeting"}
    - {name: China Satellite Navigation Conference, short: CSNC, rank: Major, area: BeiDou / GNSS,
       url: "http://www.beidou.org/"}
    - {name: IGS Workshop, short: IGS, rank: Major, area: GNSS geodesy,
       url: "https://igs.org/workshop/"}
  # IEEE special-issue calls are looked up for every journal in crossref.journals (+ these), kept if SJR Q1/Q2
  extra_journals:
    - {name: IEEE Journal of Selected Topics in Signal Processing, issn: 1932-4553}
    - {name: IEEE Trans. Aerospace & Electronic Systems (electronic), issn: 1557-9603}
  wikicfp_categories: [gnss, navigation, positioning, localization, geodesy]
  wikicfp_keywords: [gnss, gps, navigation, positioning, localization, localisation, pnt, geodes, satellite, beidou, galileo]
